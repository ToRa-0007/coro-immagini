name: coro

# Coro senza Claude e senza costi: ogni quarto d'ora raccoglie i feed di 92 testate, li riunisce in storie,
# traduce i titoli esteri con modelli aperti (OPUS-MT), compone la prima pagina alle 07 e alle 19,
# pubblica la web app su GitHub Pages e, quando serve, ricostruisce l'app Android (coro.apk).
# Tutto il codice è qui sotto, compresso: questo file basta da solo.
on:
  schedule:
    - cron: '7,22,37,52 4-21 * * *'
    - cron: '7 0-3,22,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/raccolta.yml']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: coro
  cancel-in-progress: false

jobs:
  coro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
