name: raccolta

on:
  schedule:
    - cron: '30 4,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/raccolta.yml']

permissions:
  contents: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
