name: raccolta

# Coro, raccolta v3: ogni ora dalle 06:40 alle 23:40 (ora italiana estiva), a ogni modifica di questo file
# e a richiesta (Actions > raccolta > Run workflow). Pubblica sul ramo "dati", sostituendolo.
on:
  schedule:
    - cron: '40 4-21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/raccolta.yml']

permissions:
  contents: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: |
          pip install --quiet feedparser requests pillow python-dateutil
          pip install --quiet cairosvg || true
      - name: Stato della raccolta precedente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --quiet --depth 1 --branch dati --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state; then
            rm -rf state && mkdir state && git -C state init -q -b dati
          fi
