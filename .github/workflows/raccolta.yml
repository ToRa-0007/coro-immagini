name: coro

# Coro senza Claude e senza costi: ogni quarto d'ora raccoglie i feed di oltre 100 testate (anche Roma e provincia), li riunisce in storie,
# traduce i titoli esteri con modelli aperti (OPUS-MT), compone la prima pagina alle 07 e alle 19,
# pubblica la web app su GitHub Pages e, quando serve, ricostruisce l'app Android (coro.apk).
# Tutto il codice è qui sotto, compresso: questo file basta da solo.
#
# Gli orari programmati di GitHub («schedule») partono con ore di ritardo o vengono saltati. Per questo ogni giro,
# alla fine, prenota il successivo: il giro prenotato aspetta 12 minuti dalla prenotazione e poi parte.
# L'attesa avviene nell'ambiente «attesa» se ha il timer (Settings → Environments, timer di 12 minuti), dove non usa
# macchine; se il timer manca, il lavoro «attesa» aspetta da sé il tempo che resta, così la catena non si ferma mai.
# Gli orari restano solo come riserva per riavviare la catena.
on:
  schedule:
    - cron: '7,22,37,52 4-21 * * *'
    - cron: '7 0-3,22,23 * * *'
  workflow_dispatch:
    inputs:
      catena:
        description: 'Giro prenotato dal giro precedente (per un avvio a mano lasciare «no»)'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

# Permessi minimi: di base solo lettura, ogni lavoro chiede quello che gli serve.
permissions:
  contents: read

jobs:
  # Se un giro resta bloccato (GitHub a volte lascia un lavoro «in coda» per ore), lo annulla:
  # altrimenti tutti i giri successivi aspetterebbero dietro di lui.
  sblocca:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Libera i giri rimasti bloccati
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
          NOW=$(date -u +%s)
          for st in queued in_progress waiting pending requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=$st&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.run_number)"' || true
          done | sort -u | while read -r id created num; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            age=$(( (NOW - $(date -u -d "$created" +%s)) / 60 ))
            if [ "$age" -ge 50 ]; then
              echo "giro #$num fermo da $age minuti: lo annullo"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              if [ "$age" -ge 110 ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
              fi
            fi
          done
          echo "controllo dei giri bloccati completato"

  # Giro prenotato: aspetta 12 minuti dalla prenotazione, poi lascia partire la redazione.
  # Con il timer sull'ambiente «attesa» il tempo è già passato quando il lavoro parte (nessuna macchina occupata);
  # senza timer (ambiente nuovo o senza regole) il passo aspetta il tempo che manca. Prima la catena si fermava subito
  # e le notizie si aggiornavano solo con gli orari di GitHub, cioè ogni molte ore.
  attesa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.catena == 'si' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    environment: attesa
    steps:
      - name: Attendi i 12 minuti dalla prenotazione
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ATTESA_MIN=12
          ETA=0
          if CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>err.txt)               && [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] && START=$(date -u -d "$CREATED" +%s); then
            ETA=$(( $(date -u +%s) - START ))
            if [ "$ETA" -lt 0 ]; then ETA=0; fi
          else
            echo "::warning::non riesco a leggere l'ora della prenotazione ($(head -c 200 err.txt)): conto l'attesa da ora"
          fi
          RESTA=$(( ATTESA_MIN * 60 - ETA ))
          if [ "$RESTA" -gt 0 ]; then
            echo "dalla prenotazione sono passati $ETA secondi (l'ambiente «attesa» non ha fatto aspettare): aspetto altri $RESTA secondi"
            sleep "$RESTA"
          else
            echo "attesa già trascorsa ($ETA secondi dalla prenotazione)"
          fi
          echo "attesa finita, parte il giro"

  coro:
    needs: [sblocca, attesa]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # un giro alla volta: due giri insieme scriverebbero lo stesso ramo dati e l'ultimo cancellerebbe il lavoro dell'altro
    concurrency:
      group: coro-redazione
      cancel-in-progress: false
    permissions:
      contents: write   # ramo dati
      pages: write      # pubblicazione del sito
      id-token: write   # pubblicazione del sito
      actions: write    # prenotazione del giro successivo, orario automatico
      issues: write     # segnalazioni dall'app e avvisi di guasto
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
