name: coro

# Coro senza Claude e senza costi: ogni quarto d'ora raccoglie i feed di 92 testate, li riunisce in storie,
# traduce i titoli esteri con modelli aperti (OPUS-MT), compone la prima pagina alle 07 e alle 19,
# pubblica la web app su GitHub Pages e, quando serve, ricostruisce l'app Android (coro.apk).
# Tutto il codice è qui sotto, compresso: questo file basta da solo.
on:
  schedule:
    - cron: '7,22,37,52 4-21 * * *'
    - cron: '7 0-3,22,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  # Se un giro resta bloccato (GitHub a volte lascia un lavoro «in coda» per ore), lo annulla:
  # altrimenti tutti i giri successivi aspetterebbero dietro di lui.
  sblocca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Libera i giri rimasti bloccati
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
          NOW=$(date -u +%s)
          for st in queued in_progress waiting pending requested; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=$st&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.run_number)"' || true
          done | sort -u | while read -r id created num; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            age=$(( (NOW - $(date -u -d "$created" +%s)) / 60 ))
            if [ "$age" -ge 50 ]; then
              echo "giro #$num fermo da $age minuti: lo annullo"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              if [ "$age" -ge 110 ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
              fi
            fi
          done
          echo "controllo dei giri bloccati completato"

  coro:
    needs: sblocca
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: coro-redazione
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Codice di Coro (1/4)
