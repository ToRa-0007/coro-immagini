      - name: Estrai il codice
        run: |
          set -o pipefail
          base64 -d coro.b64 > coro.tar.xz
          # impronta del codice: un file caricato a metà o modificato a mano si ferma qui con un messaggio chiaro
          if ! echo "ee612750717b726424d89c50ad0bb8d928929b38c8c16c6bbc5ecc0ed8d6dd3c  coro.tar.xz" | sha256sum -c --quiet; then
            echo "::error::codice di Coro incompleto o alterato: ricarica raccolta.yml intero"; exit 1
          fi
          xz -d < coro.tar.xz | tar -xf -
          rm coro.b64 coro.tar.xz
          ls coro
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: coro/pipeline/requirements.txt
      - name: Dipendenze
        run: |
          pip install --quiet -r coro/pipeline/requirements.txt
          pip install --quiet cairosvg || true
      - name: Controlli del codice
        run: |
          # un codice rotto non arriva al sito: il giro si ferma qui e resta online la versione precedente
          python -m py_compile coro/pipeline/*.py coro/build_site.py coro/make_icons.py
          python coro/pipeline/selftest.py
          node --check coro/site_src/app.js
          node --check coro/site_src/sw.js
      - name: Stato precedente (ramo dati)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$REPO" dati >/dev/null || rc=$?
          if [ $rc -eq 0 ]; then
            git clone --quiet --depth 1 --branch dati --single-branch "$REPO" state
          elif [ $rc -eq 2 ]; then
            echo "primo avvio: stato nuovo"; mkdir state && git -C state init -q -b dati
          else
            echo "::error::ramo dati irraggiungibile, riprovo al prossimo giro"; exit 1
          fi
          rm -rf state/img
      - name: Modelli di traduzione (copia salvata)
        uses: actions/cache/restore@v6
        with:
          path: mt
          key: coro-mt-v1-${{ github.run_id }}
          restore-keys: coro-mt-v1-
      - name: Prepara i modelli di traduzione mancanti
        id: mt
        continue-on-error: true
        timeout-minutes: 25
        run: |
          if python coro/pipeline/translate.py need mt; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet "transformers>=4.40,<5" "huggingface_hub<1" sacremoses protobuf
            python coro/pipeline/translate.py setup mt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "modelli già pronti"
          fi
      - name: Salva i modelli di traduzione
        if: steps.mt.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: mt
          key: coro-mt-v1-${{ github.run_id }}
      # I passi con continue-on-error lasciano proseguire il giro (meglio un'edizione con le notizie già raccolte che nessuna),
      # ma non passano inosservati: «Esito del giro», alla fine, li elenca e rende rosso il giro.
      - name: Raccolta
        id: raccolta
        continue-on-error: true
        timeout-minutes: 12
        run: python coro/pipeline/collect.py coro/pipeline/sources.json state
      - name: Segnalazioni dall'app
        id: segnalazioni
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python coro/pipeline/reports.py state
      - name: Chiave di firma dell'app Android
        uses: actions/cache/restore@v6
        with:
          path: apkkey
          key: coro-apk-key-v1
      - name: Chiave di firma protetta (segreto e copia cifrata)
        id: chiave
        continue-on-error: true
        env:
          KEYPASS: ${{ secrets.CORO_KEY_PASS }}
        run: |
          # Con il segreto CORO_KEY_PASS la chiave prende quella password e ne resta una copia cifrata (AES-256) sul ramo dati:
          # se la cache di GitHub la perde, viene ripristinata e l'app installata continua ad accettare gli aggiornamenti.
          if [ -z "$KEYPASS" ]; then
            echo "::notice::segreto CORO_KEY_PASS non impostato: la chiave di firma resta solo nella cache di GitHub, con la password predefinita"
            exit 0
          fi
          mkdir -p apkkey state/apk
          ERR=0
          if [ ! -f apkkey/coro.jks ] && [ -f state/apk/key.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in state/apk/key.enc -out apkkey/coro.jks -pass env:KEYPASS; then
              echo "chiave di firma ripristinata dalla copia cifrata"
            else
              rm -f apkkey/coro.jks; ERR=1
              echo "::error::copia cifrata della chiave non decifrabile: CORO_KEY_PASS non è quello usato per cifrarla"
            fi
          fi
          [ -f apkkey/coro.jks ] || exit $ERR
          if keytool -list -keystore apkkey/coro.jks -storepass coro-app >/dev/null 2>&1; then
            keytool -storepasswd -keystore apkkey/coro.jks -storepass coro-app -new "$KEYPASS" >/dev/null 2>&1
          fi
          if ! keytool -list -keystore apkkey/coro.jks -storepass "$KEYPASS" >/dev/null 2>&1; then
            echo "::error::la chiave di firma non si apre né con la password predefinita né con CORO_KEY_PASS"; exit 1
          fi
          FP=$(keytool -list -keystore apkkey/coro.jks -storepass "$KEYPASS" -alias coro 2>/dev/null | grep -i 'sha-\?256' | sha256sum | cut -c1-16)
          if [ ! -f state/apk/key.enc ] || [ "$(cat state/apk/key.fp 2>/dev/null)" != "$FP" ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 300000 -in apkkey/coro.jks -out state/apk/key.enc -pass env:KEYPASS
            echo "$FP" > state/apk/key.fp
            echo "copia cifrata della chiave di firma aggiornata"
          fi
      - name: Serve una nuova app Android?
        id: apk
        run: |
          python coro/make_icons.py /tmp/coro_icons coro/android/app/src/main/res >/dev/null
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          URL="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
          HASH=$( (cd coro/android && find . -type f ! -name '*.png' -print0 | sort -z | xargs -0 sha1sum; sha1sum < ../make_icons.py; echo "$URL") | sha1sum | cut -c1-16)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          BUILD=true
          if [ -f state/apk/coro.apk ] && [ "$(cat state/apk/hash.txt 2>/dev/null)" = "$HASH" ]; then
            BUILD=false; echo "app Android già aggiornata"
          fi
          if [ "$BUILD" = true ] && [ -f state/apk/coro.apk ] && [ ! -f apkkey/coro.jks ]; then
            # con una chiave nuova Android rifiuterebbe l'aggiornamento dell'app già installata
            BUILD=false; echo "::warning::chiave di firma non trovata: tengo l'APK attuale invece di firmarne uno incompatibile"
          fi
          if [ "$BUILD" = true ] && [ "$(cat state/apk/fail.txt 2>/dev/null)" = "$HASH $(date -u +%F)" ]; then
            BUILD=false; echo "costruzione già fallita oggi con questo codice: riprovo domani"
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = true ]; then echo "da costruire per $URL"; fi
          if [ ! -f apkkey/coro.jks ]; then echo "newkey=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v6
        if: steps.apk.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.apk.outputs.build == 'true'
        with:
          gradle-version: '8.9'
          # dalla v6 la cache di Gradle è un componente proprietario con condizioni d'uso proprie: spenta, si usa solo
          # l'installazione di Gradle (l'app si ricostruisce di rado, la cache farebbe risparmiare un minuto)
          cache-disabled: true
      - name: Costruisci l'app Android
        id: build
        if: steps.apk.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CORO_URL: ${{ steps.apk.outputs.url }}
          CORO_KEY_PASS: ${{ secrets.CORO_KEY_PASS || 'coro-app' }}
          HASH: ${{ steps.apk.outputs.hash }}
        run: |
          mkdir -p apkkey state/apk
          if [ ! -f apkkey/coro.jks ]; then
            keytool -genkeypair -keystore apkkey/coro.jks -storepass "$CORO_KEY_PASS" -keypass "$CORO_KEY_PASS" -alias coro -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Coro, O=Coro, C=IT"
          fi
          # numero di versione sempre crescente (minuti dal 1970): non riparte da 1 se il workflow cambia nome
          export CORO_KEYSTORE="$GITHUB_WORKSPACE/apkkey/coro.jks" CORO_VERSION_CODE="$(( $(date -u +%s) / 60 ))" CORO_VERSION_NAME="1.$(date -u +%y%m%d.%H%M)"
          cd coro/android
          gradle --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/state/apk/coro.apk"
          echo "$HASH" > "$GITHUB_WORKSPACE/state/apk/hash.txt"
          rm -f "$GITHUB_WORKSPACE/state/apk/fail.txt"
          ls -la "$GITHUB_WORKSPACE/state/apk"
      - name: Annota la costruzione non riuscita
        if: steps.build.outcome == 'failure'
        env:
          HASH: ${{ steps.apk.outputs.hash }}
        run: |
          mkdir -p state/apk
          echo "$HASH $(date -u +%F)" > state/apk/fail.txt
      - name: Copia cifrata della chiave appena creata
        # la prima chiave nasce durante la costruzione: la copia cifrata parte con questo stesso giro, non con il successivo
        if: steps.apk.outputs.newkey == 'true' && hashFiles('apkkey/coro.jks') != ''
        id: chiave_nuova
        continue-on-error: true
        env:
          KEYPASS: ${{ secrets.CORO_KEY_PASS }}
        run: |
          [ -n "$KEYPASS" ] || exit 0
          mkdir -p state/apk
          FP=$(keytool -list -keystore apkkey/coro.jks -storepass "$KEYPASS" -alias coro 2>/dev/null | grep -i 'sha-\?256' | sha256sum | cut -c1-16)
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 300000 -in apkkey/coro.jks -out state/apk/key.enc -pass env:KEYPASS
          echo "$FP" > state/apk/key.fp
          echo "copia cifrata della nuova chiave di firma creata"
      - name: Conserva la chiave di firma
        if: steps.apk.outputs.newkey == 'true' && hashFiles('apkkey/coro.jks') != ''
        uses: actions/cache/save@v6
        with:
          path: apkkey
          key: coro-apk-key-v1
      - name: Redazione automatica
        id: redazione
        run: |
          if [ -f state/apk/coro.apk ]; then export CORO_APK=coro.apk; fi
          mkdir -p state/ultimo
          if timeout 12m python coro/pipeline/editor.py state site mt; then
            # indice dell'ultima edizione: l'app lo legge dal sito e dal ramo dati e scarica le notizie solo se sono nuove
            python -c "import json; m = json.load(open('site/data/feed.json', encoding='utf-8'))['meta']; json.dump({'runAt': m['runAt']}, open('site/data/meta.json', 'w'))"
            cp site/data/feed.json site/data/archive.json site/data/meta.json state/ultimo/
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::redazione non riuscita: ripubblico l'ultima edizione buona"
            mkdir -p site/data && { cp state/ultimo/*.json site/data/ 2>/dev/null || echo "::warning::nessuna edizione precedente"; }
          fi
      - name: Sito
        id: sito
        run: |
          python coro/build_site.py site
          mkdir -p site/logos && cp state/logos/*.png site/logos/ 2>/dev/null || true
          if [ -f state/apk/coro.apk ]; then cp state/apk/coro.apk site/coro.apk; fi
          # si pubblica solo un sito con tutti i file di dati leggibili e una prima pagina non vuota
          if python - <<'PY'
          import json, os, sys
          try:
              d = json.load(open('site/data/feed.json', encoding='utf-8'))
              assert d.get('stories'), 'prima pagina vuota'
              for f in ('site/data/archive.json', 'site/version.json', 'site/manifest.webmanifest'):
                  if f.endswith('archive.json') and not os.path.exists(f):
                      continue
                  json.load(open(f, encoding='utf-8'))
          except Exception as e:
              print('dati del sito non validi:', e)
              sys.exit(1)
          PY
          then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # GitHub Pages applica solo una parte delle pubblicazioni troppo ravvicinate: il sito si pubblica quando
            # cambia l'app oppure dopo 55 minuti dall'ultima volta. Le notizie di ogni giro l'app le legge dal ramo dati.
            BUILD=$(python -c "import json; print(json.load(open('site/version.json'))['b'])")
            read -r PB PT 2>/dev/null < state/deploy.txt || true
            ORA=$(date -u +%s)
            if [ "$PB" != "$BUILD" ] || ! [[ "$PT" =~ ^[0-9]+$ ]] || [ $(( ORA - PT )) -ge 3300 ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "$BUILD $ORA" > state/deploy.txt
              echo "il sito viene pubblicato"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "sito pubblicato $(( (ORA - PT) / 60 )) minuti fa e app invariata: le notizie nuove vanno sul ramo dati"
            fi
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::nessuna edizione valida da pubblicare: resta online la versione precedente del sito"
          fi
          du -sh site || true
      - name: Salva lo stato sul ramo dati
        id: stato
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd state
          find . -path ./.git -prune -o -name '*.tmp' -type f -exec rm -f {} +
          # un JSON troncato non deve sostituire lo stato buono: in quel caso il giro dopo riparte dal precedente
          if ! python - <<'PY'
          import json, os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if f.endswith('.json'):
                      try:
                          json.load(open(os.path.join(root, f), encoding='utf-8'))
                      except Exception:
                          bad.append(os.path.join(root, f))
          if bad:
              print('file non validi:', ', '.join(bad))
          sys.exit(1 if bad else 0)
          PY
          then
            echo "::error::stato danneggiato: non lo salvo, il giro dopo riparte dal precedente"; exit 1
          fi
          git config user.name "coro-bot"
          git config user.email "coro-bot@users.noreply.github.com"
          git checkout -q --orphan nuovo
          git add -A
          git commit -qm "coro $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nuovo:dati
      - name: Tieni attivo l'orario automatico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          CATENA: ${{ inputs.catena }}
        run: |
          # GitHub sospende gli orari dei repository pubblici dopo 60 giorni senza attività: una volta al giorno li riconferma
          if [ "$(date -u +%H)" = "03" ] || { [ "$EVENTO" != "schedule" ] && [ "$CATENA" != "si" ]; }; then
            WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/enable" && echo "orario confermato ($WF)"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.sito.outputs.ok == 'true' && steps.sito.outputs.deploy == 'true'
        with:
          path: site
          include-hidden-files: true
      - name: Pubblica il sito
        id: deploy
        if: steps.sito.outputs.ok == 'true' && steps.sito.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
      - name: Prenota il prossimo giro
        id: prenota
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # senza copia del repository gh non sa a quale repository rivolgersi: va indicato
          GH_REPO: ${{ github.repository }}
          CATENA: ${{ inputs.catena }}
        run: |
          WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 60 ))
          # un giro prenotato che non ha aspettato (il lavoro «attesa» è fallito o è stato interrotto) fermerebbe la catena
          # invece di far partire un giro ogni tre minuti: ci si ferma e si guarda il registro del lavoro «attesa»
          if [ "$CATENA" = "si" ] && [ "$AGE" -lt 9 ]; then
            echo "nota=catena ferma: il giro prenotato non ha aspettato i 12 minuti (vedi il registro del lavoro «attesa»)" >> "$GITHUB_OUTPUT"
            echo "::warning::il giro prenotato non ha aspettato: guarda il registro del lavoro «attesa». Restano gli orari di GitHub."
            exit 0
          fi
          # una sola catena: se c'è già un giro in attesa o in coda non ne prenoto un altro
          ALTRI=0
          for st in queued waiting in_progress pending requested; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=$st&per_page=30" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length")
            ALTRI=$((ALTRI + n))
          done
          if [ "$ALTRI" -gt 0 ]; then
            echo "c'è già un giro in programma ($ALTRI): non ne prenoto un altro"
            exit 0
          fi
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f catena=si
          echo "prossimo giro prenotato: parte tra circa 12 minuti"
      # Riassunto del giro: i problemi gravi rendono rosso il giro; dopo tre giri rossi di fila si apre un avviso
      # (issue «Coro: giri non riusciti», con notifica al proprietario) che si chiude da solo al primo giro regolare.
      - name: Esito del giro
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAVORO: ${{ job.status }}
          RACCOLTA: ${{ steps.raccolta.outcome }}
          SEGNALAZIONI: ${{ steps.segnalazioni.outcome }}
          CHIAVE: ${{ steps.chiave.outcome }} ${{ steps.chiave_nuova.outcome }}
          APK: ${{ steps.build.outcome }}
          REDAZIONE: ${{ steps.redazione.outputs.ok }}
          SITO: ${{ steps.sito.outputs.ok }}
          STATO: ${{ steps.stato.outcome }}
          PRENOTA: ${{ steps.prenota.outcome }}
          NOTA: ${{ steps.prenota.outputs.nota }}
        run: |
          G=""; L=""
          grave() { G="$G- $1"$'\n'; echo "::error::$1"; }
          lieve() { L="$L- $1"$'\n'; echo "::warning::$1"; }
          if [ "$LAVORO" != "success" ]; then grave "un passo indispensabile si è fermato: il primo passo rosso del giro dice quale"; fi
          if [ "$RACCOLTA" = "failure" ]; then grave "raccolta delle notizie non riuscita"; fi
          if [ "$REDAZIONE" = "false" ]; then grave "redazione non riuscita: è online l'ultima edizione buona"; fi
          if [ "$SITO" = "false" ]; then grave "nessuna edizione valida: il sito non è stato aggiornato"; fi
          if [ "$STATO" = "failure" ]; then grave "stato non salvato sul ramo dati"; fi
          if [ "$PRENOTA" = "failure" ]; then grave "prossimo giro non prenotato: fino al prossimo orario di GitHub l'app non si aggiorna"; fi
          if [ "$SEGNALAZIONI" = "failure" ]; then lieve "segnalazioni dall'app non lette"; fi
          if [[ "$CHIAVE" == *failure* ]]; then lieve "protezione della chiave di firma non riuscita"; fi
          if [ "$APK" = "failure" ]; then lieve "app Android non ricostruita: nuovo tentativo domani"; fi
          if [ -n "$NOTA" ]; then lieve "$NOTA"; fi
          {
            echo "### Esito del giro"
            if [ -z "$G$L" ]; then echo "Tutto regolare."; fi
            if [ -n "$G" ]; then printf 'Problemi gravi:\n\n%s\n' "$G"; fi
            if [ -n "$L" ]; then printf 'Da sapere:\n\n%s\n' "$L"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
          TITOLO="Coro: giri non riusciti"
          APERTA=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"$TITOLO\" and .user.login == \"github-actions[bot]\") | .number][0] // empty" 2>/dev/null || true)
          if [ -n "$G" ]; then
            PRIMA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=completed&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .conclusion == \"failure\") | .conclusion][:2] | join(\" \")" 2>/dev/null || true)
            if [ "$PRIMA" = "failure failure" ] && [ -z "$APERTA" ]; then
              CORPO="Gli ultimi tre giri di Coro non sono riusciti: l'app non si aggiorna.

          Ultimo giro: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Problemi:

          $G
          L'avviso si chiude da solo al primo giro regolare.

          @$GITHUB_REPOSITORY_OWNER"
              if gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$TITOLO" -f body="$CORPO" >/dev/null; then
                echo "avviso aperto"
              else
                echo "::warning::avviso non aperto (issue disattivate o permessi)"
              fi
            fi
            exit 1
          fi
          if [ -n "$APERTA" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$APERTA/comments" -f body="Giro di nuovo regolare: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$APERTA" -f state=closed -f state_reason=completed >/dev/null && echo "avviso chiuso" || true
          fi

  # Se la redazione non parte (macchina non assegnata) o si ferma prima di prenotare il giro successivo, lo prenota
  # questo lavoro: la catena non resta ferma fino al prossimo orario di GitHub (è successo: quasi cinque ore).
  riprendi:
    needs: [coro]
    if: ${{ !cancelled() && needs.coro.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Prenota il prossimo giro se manca
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
          sleep 15
          ALTRI=0
          for st in queued waiting in_progress pending requested; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?status=$st&per_page=30" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length")
            ALTRI=$((ALTRI + n))
          done
          if [ "$ALTRI" -gt 0 ]; then
            echo "c'è già un giro in programma ($ALTRI): non ne prenoto un altro"
            exit 0
          fi
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f catena=si
          echo "::warning::la redazione non ha finito il giro: ho prenotato io il prossimo (parte tra circa 12 minuti)"
