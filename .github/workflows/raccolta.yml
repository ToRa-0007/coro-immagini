      - name: Estrai il codice
        run: |
          base64 -d coro.b64 | xz -d | tar -xf -
          rm coro.b64
          ls coro
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: coro/pipeline/requirements.txt
      - name: Dipendenze
        run: |
          pip install --quiet -r coro/pipeline/requirements.txt
          pip install --quiet cairosvg || true
      - name: Stato precedente (ramo dati)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$REPO" dati >/dev/null || rc=$?
          if [ $rc -eq 0 ]; then
            git clone --quiet --depth 1 --branch dati --single-branch "$REPO" state
          elif [ $rc -eq 2 ]; then
            echo "primo avvio: stato nuovo"; mkdir state && git -C state init -q -b dati
          else
            echo "::error::ramo dati irraggiungibile, riprovo al prossimo giro"; exit 1
          fi
          rm -rf state/img
      - name: Modelli di traduzione (copia salvata)
        uses: actions/cache/restore@v5
        with:
          path: mt
          key: coro-mt-v1-${{ github.run_id }}
          restore-keys: coro-mt-v1-
      - name: Prepara i modelli di traduzione mancanti
        id: mt
        continue-on-error: true
        timeout-minutes: 25
        run: |
          if python coro/pipeline/translate.py need mt; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet "transformers>=4.40,<5" "huggingface_hub<1" sacremoses protobuf
            python coro/pipeline/translate.py setup mt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "modelli già pronti"
          fi
      - name: Salva i modelli di traduzione
        if: steps.mt.outputs.changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: mt
          key: coro-mt-v1-${{ github.run_id }}
      - name: Raccolta
        continue-on-error: true
        timeout-minutes: 12
        run: python coro/pipeline/collect.py coro/pipeline/sources.json state
      - name: Chiave di firma dell'app Android
        uses: actions/cache/restore@v5
        with:
          path: apkkey
          key: coro-apk-key-v1
      - name: Serve una nuova app Android?
        id: apk
        run: |
          python coro/make_icons.py /tmp/coro_icons coro/android/app/src/main/res >/dev/null
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          URL="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
          HASH=$( (cd coro/android && find . -type f ! -name '*.png' -print0 | sort -z | xargs -0 sha1sum; sha1sum < ../make_icons.py; echo "$URL") | sha1sum | cut -c1-16)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          BUILD=true
          if [ -f state/apk/coro.apk ] && [ "$(cat state/apk/hash.txt 2>/dev/null)" = "$HASH" ]; then
            BUILD=false; echo "app Android già aggiornata"
          fi
          if [ "$BUILD" = true ] && [ -f state/apk/coro.apk ] && [ ! -f apkkey/coro.jks ]; then
            # con una chiave nuova Android rifiuterebbe l'aggiornamento dell'app già installata
            BUILD=false; echo "::warning::chiave di firma non trovata: tengo l'APK attuale invece di firmarne uno incompatibile"
          fi
          if [ "$BUILD" = true ] && [ "$(cat state/apk/fail.txt 2>/dev/null)" = "$HASH $(date -u +%F)" ]; then
            BUILD=false; echo "costruzione già fallita oggi con questo codice: riprovo domani"
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = true ]; then echo "da costruire per $URL"; fi
          if [ ! -f apkkey/coro.jks ]; then echo "newkey=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v5
        if: steps.apk.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        if: steps.apk.outputs.build == 'true'
        with:
          gradle-version: '8.9'
      - name: Costruisci l'app Android
        id: build
        if: steps.apk.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CORO_URL: ${{ steps.apk.outputs.url }}
          CORO_KEY_PASS: coro-app
        run: |
          mkdir -p apkkey state/apk
          if [ ! -f apkkey/coro.jks ]; then
            keytool -genkeypair -keystore apkkey/coro.jks -storepass "$CORO_KEY_PASS" -keypass "$CORO_KEY_PASS" -alias coro -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Coro, O=Coro, C=IT"
          fi
          # numero di versione sempre crescente (minuti dal 1970): non riparte da 1 se il workflow cambia nome
          export CORO_KEYSTORE="$GITHUB_WORKSPACE/apkkey/coro.jks" CORO_VERSION_CODE="$(( $(date -u +%s) / 60 ))" CORO_VERSION_NAME="1.$(date -u +%y%m%d.%H%M)"
          cd coro/android
          gradle --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/state/apk/coro.apk"
          echo "${{ steps.apk.outputs.hash }}" > "$GITHUB_WORKSPACE/state/apk/hash.txt"
          rm -f "$GITHUB_WORKSPACE/state/apk/fail.txt"
          ls -la "$GITHUB_WORKSPACE/state/apk"
      - name: Annota la costruzione non riuscita
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p state/apk
          echo "${{ steps.apk.outputs.hash }} $(date -u +%F)" > state/apk/fail.txt
      - name: Conserva la chiave di firma
        if: steps.apk.outputs.newkey == 'true' && hashFiles('apkkey/coro.jks') != ''
        uses: actions/cache/save@v5
        with:
          path: apkkey
          key: coro-apk-key-v1
      - name: Redazione automatica
        run: |
          if [ -f state/apk/coro.apk ]; then export CORO_APK=coro.apk; fi
          mkdir -p state/ultimo
          if timeout 12m python coro/pipeline/editor.py state site mt; then
            cp site/data/feed.json site/data/archive.json state/ultimo/
          else
            echo "::warning::redazione non riuscita: ripubblico l'ultima edizione buona"
            mkdir -p site/data && { cp state/ultimo/*.json site/data/ 2>/dev/null || echo "::warning::nessuna edizione precedente"; }
          fi
      - name: Sito
        id: sito
        run: |
          python coro/build_site.py site
          mkdir -p site/logos && cp state/logos/*.png site/logos/ 2>/dev/null || true
          if [ -f state/apk/coro.apk ]; then cp state/apk/coro.apk site/coro.apk; fi
          if python -c "import json, sys; d = json.load(open('site/data/feed.json', encoding='utf-8')); sys.exit(0 if d.get('stories') else 1)" 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::nessuna edizione valida da pubblicare: resta online la versione precedente del sito"
          fi
          du -sh site || true
      - name: Salva lo stato sul ramo dati
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd state
          find . -path ./.git -prune -o -name '*.tmp' -type f -exec rm -f {} +
          # un JSON troncato non deve sostituire lo stato buono: in quel caso il giro dopo riparte dal precedente
          if ! python - <<'PY'
          import json, os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if f.endswith('.json'):
                      try:
                          json.load(open(os.path.join(root, f), encoding='utf-8'))
                      except Exception:
                          bad.append(os.path.join(root, f))
          if bad:
              print('file non validi:', ', '.join(bad))
          sys.exit(1 if bad else 0)
          PY
          then
            echo "::warning::stato danneggiato: non lo salvo"; exit 0
          fi
          git config user.name "coro-bot"
          git config user.email "coro-bot@users.noreply.github.com"
          git checkout -q --orphan nuovo
          git add -A
          git commit -qm "coro $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nuovo:dati
      - name: Tieni attivo l'orario automatico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub sospende gli orari dei repository pubblici dopo 60 giorni senza attività: una volta al giorno li riconferma
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/enable" && echo "orario confermato ($WF)"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.sito.outputs.ok == 'true'
        with:
          path: site
          include-hidden-files: true
      - name: Pubblica il sito
        id: deploy
        if: steps.sito.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
